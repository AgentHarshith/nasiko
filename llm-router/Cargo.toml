[package]
name = "nasiko-llm-router"
edition.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

# Optional standalone service (P2.9). The router normally runs in-process in
# nasiko-server; this binary serves the same router(ctx) as its own process.
[[bin]]
name = "llm-router"
path = "src/bin/llm-router.rs"

[dependencies]
# Internal — AES-GCM (per-user HKDF) decrypt of user_secrets via try_for_user
nasiko-secrets.workspace = true
nasiko-pricing.workspace = true
nasiko-savings.workspace = true
# Internal — structural payload compression at the egress seam (src/compress.rs)
nasiko-compress.workspace = true
# Internal — compact tool catalog + `<<call …>>` decoder (src/compact_tools.rs). A direct path
# rather than a workspace entry keeps the root manifest change to the new member alone.
nasiko-tool-compact = { path = "../tool-compact" }

# Web / async
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Query classifier — regex categories + Thompson-sampling tier selection
regex = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }

# Storage & outbound HTTP (the crate owns these via LlmRouterCtx — no nasiko-server dep)
sqlx = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
futures = { workspace = true }
async-stream = { workspace = true }
bytes = { workspace = true }

# Auth (agent-identity JWT verify)
jsonwebtoken = { workspace = true }

# Resolver cache + identifiers
dashmap = { workspace = true }
uuid = { workspace = true }

# Router decision cache (S3) — sticky (conv_id, agent_id) → model across turns/scale
redis = { workspace = true }

# Errors / time / logging
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
# Used only by the standalone `llm-router` binary for log output.
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
base64 = { workspace = true }
mockito = { workspace = true }
tower = { workspace = true }
zstd.workspace = true
# Used only by examples/compact_tools_measure.rs. Exact pins because the measurement report
# quotes them. toon-format's default `cli` feature would pull ratatui, crossterm 0.28 and an
# older tiktoken-rs into the lockfile; it must stay off.
tiktoken-rs = { version = "=0.12.1", default-features = false }
toon-format = { version = "=0.5.0", default-features = false }

# The evaluation examples keep their logic in examples/support/ and test it there.
[[example]]
name = "compact_tools_eval"
test = true

[[example]]
name = "compact_tools_measure"
test = true
